# docker-compose.yml · ViaSerra Transportes
#
# Este arquivo sobe os dois sites de uma vez, no lugar de dois "docker run".
# Portas configuradas para a matrícula 26175647; rode: docker compose up -d
# Não mude a indentação: no YAML, os espaços no começo da linha fazem parte da sintaxe.

services:

  portal:
    image: "${DOCKERHUB_USER}/viaserra-portal:1.0-${MATRICULA}"
    ports:
      - "8047:80"              # porta do host: 8000 + XX
    restart: unless-stopped

  manutencao:
    build: ./manutencao
    ports:
      - "7047:80"              # porta do host: 7000 + XX
    restart: unless-stopped
